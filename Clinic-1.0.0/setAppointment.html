<body>

  <div id="header-placeholder"></div>

  <main>
    <h1>Select a doctor</h1>
    <div class="spinner" id="loadingSpin"></div>
      <div id="tableContainer" class="doctors-table-wrap">
  <table class="doctors-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Specialty</th>
        <th>Department</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
  </table>
</div>

<h2>Patient's Appointments</h2>
<div id="App_Placeholder">

</div>
  </main>
  <dialog id="diagAddNew">
      <div class="form-container">
    <div class="form-header">
      <h2>Book an Appointment</h2>
      <p>Fill in the details below to schedule an appointment.</p>
    </div>

    <form id="frmInfo">

    

      <!-- Date -->
      <div class="form-group">
        <label for="date">Date</label>
        <input type="date" id="date" name="date" required>
      </div>

      <!-- Time -->
      <div class="form-group">
        <label for="time">Time</label>
        <input type="time" id="time" name="time" required>
      </div>

      <!-- AppointmentStatusID — from dbo.ApointmentStatus -->
      <div class="form-group">
        <div class="select-wrapper">
          <label class="select-label" for="appointmentStatusId">Status</label>
          <select id="appointmentStatusId" name="appointmentStatusId" class="select-dropdown" required>
            <option value="" disabled selected>-- Select a Status --</option>
            <option value="1">Scheduled</option>
            <option value="2">Confirmed</option>
            <option value="3">Checked-In</option>
            <option value="4">In Progress</option>
            <option value="5">Completed</option>
            <option value="6">Cancelled</option>
            <option value="7">No-Show</option>
            <option value="8">Rescheduled</option>
          </select>
        </div>
      </div>


      <!-- Buttons -->
      <div class="dialoge-button-container">
        <button type="submit" id="btnSubmit">Book Appointment</button>
        <button type="button" class="btnCancel" id="btnCancelForm">Cancel</button>
      </div>
    </form>
  </div>

  </dialog>

  <dialog id="diagEdit">
      <div class="form-container">
    <div class="form-header">
      <h2>Book an Appointment</h2>
      <p>Fill in the details below to schedule an appointment.</p>
    </div>

    <form id="frmEditInfo">

     <div class="form-group">
        <div class="select-wrapper">
          <label class="select-label" for="appointmentStatusId">change doctor</label>
          <select id="EdDoctorsList" name="EdDoctorsList" class="select-dropdown" required>
            <option value="" disabled selected>-- Select a Status --</option>
            
          </select>
        </div>
      </div>

      <!-- Date -->
      <div class="form-group">
        <label for="date">Date</label>
        <input type="date" id="eddate" name="date" required>
      </div>

      <!-- Time -->
      <div class="form-group">
        <label for="time">Time</label>
        <input type="time" id="edtime" name="time" required>
      </div>

      <!-- AppointmentStatusID — from dbo.ApointmentStatus -->
      <div class="form-group">
        <div class="select-wrapper">
          <label class="select-label" for="appointmentStatusId">Status</label>
          <select id="EdAppointmentStatusId" name="appointmentStatusId" class="select-dropdown" required>
            <option value="" disabled selected>-- Select a Status --</option>
            <option value="1">Scheduled</option>
            <option value="2">Confirmed</option>
            <option value="3">Checked-In</option>
            <option value="4">In Progress</option>
            <option value="5">Completed</option>
            <option value="6">Cancelled</option>
            <option value="7">No-Show</option>
            <option value="8">Rescheduled</option>
          </select>
        </div>
      </div>


      <!-- Buttons -->
      <div class="dialoge-button-container">
        <button type="submit" id="edBtnSubmit">Book Appointment</button>
        <button type="button" class="btnCancel" id="edBtnCancelForm">Cancel</button>
      </div>
    </form>
  </div>

  </dialog>

  <dialog id = "diagConfirm">
    <p>Are you sure you want to cancel this appointment</p>
    <div class="SecRow-actions">
      <button class="WideButton" id="btnYes">Yes</button>
      <button class="WideButton" id="btnNo">No</button>
    </div>
  </dialog>
