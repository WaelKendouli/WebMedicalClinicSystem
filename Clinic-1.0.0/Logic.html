<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="assets/css/LoginTheme.css">
  <script src="../ClinicLogicLayer/Logging.js" defer></script>
</head>
<body>
  
    
    <h1>Al-Shefa hospital </h1>
    <form id="loginForm">
        <div class="wrap">
            <div>
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>
      </div>
      <div>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <div class="Button_Container">
            <button  type="submit">Log in</button>
            <a href="#forgot-password">forgot my password</a>
      </div>
      <p id="lbInvalid" class="Invalid">this is an error message</p>
        </div>
    </form>
</body>
</html>
