<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctors Appointmets</title>
     <!-- Favicons -->
  <link href="assets/img/favicon.png" rel="icon">
  <link href="assets/img/apple-touch-icon.png" rel="apple-touch-icon">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Montserrat:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
    rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/vendor/aos/aos.css" rel="stylesheet">
  <link href="assets/vendor/glightbox/css/glightbox.min.css" rel="stylesheet">
  <link href="assets/vendor/fontawesome-free/css/all.min.css" rel="stylesheet">
  <link href="assets/vendor/swiper/swiper-bundle.min.css" rel="stylesheet">

  <!-- Main CSS File -->
  <link href="assets/css/main.css" rel="stylesheet">


    <script src="/ClinicLogicLayer/Layout.js" defer></script>
    <script type="module" src="/ClinicLogicLayer/d_Appointment.js" defer></script>

</head>
<body>
    <div id="Doctor-header-placeholder"> </div>
   
      <div class="container" style="margin-block: 7rem;">
    <div class="card shadow-sm border-0">
      <div class="card-header bg-white py-3 border-bottom-0">
        <h2 class="h5 mb-0 text-primary">
          <span class="fw-semibold">📋</span> Appointments
          <span class="text-muted small fw-normal ms-2">us_AppointmentItemDTO</span>
        </h2>
      </div>
      <div class="card-body p-0">
        <div id="spnApptTable" class="spinner-border text-primary d-none"></div>
        <div class="table-responsive">
          <table class="table table-hover table-striped align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th scope="col" class="small text-uppercase text-secondary fw-semibold">ID</th>
                <th scope="col" class="small text-uppercase text-secondary fw-semibold">Date</th>
                <th scope="col" class="small text-uppercase text-secondary fw-semibold">Doctor</th>
                <th scope="col" class="small text-uppercase text-secondary fw-semibold">Status</th>
                <th scope="col" class="small text-uppercase text-secondary fw-semibold">Service</th>
                <th scope="col" class="small text-uppercase text-secondary fw-semibold">Patient ID</th>
                <th scope="col" class="small text-uppercase text-secondary fw-semibold">Start</th>
                <th scope="col" class="small text-uppercase text-secondary fw-semibold">End</th>
                <th scope="col" class="small text-uppercase text-secondary fw-semibold">Actions</th>
              </tr>
            </thead>
            <tbody id="target">
             
             
            </tbody>
          </table>
        </div>
      </div>  
    </div>

    <dialog id="diagSelectedAppointment" class="w-75 rounded-3">

<div class="card border-0 shadow-sm" id="selectedAppointmentCard">
    <div class="card-header bg-primary bg-opacity-10 border-0 py-3">
        <div class="d-flex justify-content-between align-items-center">
            <h5 class="mb-0 text-primary">
                <span class="me-2">📅</span>Selected Appointment
            </h5>
            <span class="badge bg-secondary" id="apptIdBadge">—</span>
        </div>
    </div>
    <div class="card-body">
        <!-- Date + Time Row -->
        <div class="row g-3 mb-3">
            <div class="col-md-4">
                <div class="d-flex align-items-center">
                    <div class="bg-primary bg-opacity-10 rounded-circle p-3 me-3">
                        <span class="fs-5">📆</span>
                    </div>
                    <div>
                        <small class="text-muted text-uppercase fw-semibold">Date</small>
                        <div class="fw-bold" id="apptDate">—</div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="d-flex align-items-center">
                    <div class="bg-success bg-opacity-10 rounded-circle p-3 me-3">
                        <span class="fs-5">⏰</span>
                    </div>
                    <div>
                        <small class="text-muted text-uppercase fw-semibold">Time</small>
                        <div class="fw-bold" id="apptS_Time">—</div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="d-flex align-items-center">
                    <div class="bg-secondary bg-opacity-10 rounded-circle p-3 me-3">
                        <span class="fs-5">⏰</span>
                    </div>
                    <div>
                        <small class="text-muted text-uppercase fw-semibold">End Time</small>
                        <div class="fw-bold" id="apptE_Time">—</div>
                    </div>
                </div>
            </div>
        </div>

        <hr class="my-3">

        <!-- Doctor + Service -->
        <div class="row g-3 mb-3">
            <div class="col-md-12">
                <small class="text-muted text-uppercase fw-semibold">Service</small>
                <div class="fw-semibold" id="apptService">—</div>
            </div>
        </div>

        <hr class="my-3">

        <!-- Patient + Status -->
        <div class="row g-3">
            <div class="col-md-6">
                <small class="text-muted text-uppercase fw-semibold">Patient name</small>
                <div class="fw-semibold" id="apptPatient">—</div>
            </div>
            <div class="col-md-6">
                <small class="text-muted text-uppercase fw-semibold">Status</small>
                <div id="apptStatus">—</div>
            </div>
        </div>
    </div>
    <div class="card-footer bg-white border-top-0 py-3 d-flex justify-content-end gap-2">
      <div id="spnApptCard" class="spinner-border text-muted d-none"></div>
        <button type="button" class="btn btn-outline-secondary" id="btnCancelSelection" commandfor="diagSelectedAppointment" command="close">
            Cancel
        </button>
        <button  type="button" class="btn btn-primary" id="btnConfirmSelection">
            Confirm Appointment
        </button>
    </div>
</div>
    </dialog>
    


  </div>


</body>
</html>
