<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="assets/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap-reboot.css">
  <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap-grid.css">
  <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap-utilities.css">

  <script type="module" src="../ClinicLogicLayer/Logging.js" defer></script>
  <script src ="../Clinic-1.0.0/vendor/bootstrap/js/bootstrap.bundle.js" defer></script>
</head>
<body class="bg-light">
  <div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow-sm p-4" style="width:80%; max-width:800px; min-width:300px;">

      <h1 class="h4 text-center mb-4">Al-Shefa Hospital</h1>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" class="form-control" id="username" name="username" required>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" name="password" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">Log in</button>

        <div class="text-center mt-3">
          <a id="lnSecondAuth" href="ForgotMyPassword.html"> I Forgot my password</a>
        </div>

        <p id="lbInvalid" class="text-danger mt-3 mb-0 d-none">This is an error message</p>
      </form>

    </div>
  </div>
</body>
</html>
