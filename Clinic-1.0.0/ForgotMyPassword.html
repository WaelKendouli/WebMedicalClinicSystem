<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alternative Login</title>
  <link rel="stylesheet" href="assets/css/LoginTheme.css">
  <script src="../ClinicLogicLayer/AltLoggin.js" defer></script>
</head>
<body>
  
    
    <h1>Al-Shefa hospital </h1>
    <form id="loginForm">
        <div class="Sec-auth">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
        <label for="phone">Phone</label>
        <input type="phone" id="phone" name="phone" required>
      </div>

      <div class="Button_Container">
            <button  type="submit">Log in</button>
      </div>
      
      <p id="lbInvalid" class="Invalid">this is an error message</p>
        </div>
    </form>
</body>
</html>
